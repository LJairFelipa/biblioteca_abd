<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mis Reservas - Biblioteca</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <!-- Barra de Navegación -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">Sistema Biblioteca</a>
            <div class="d-flex align-items-center text-white">
                <a href="/" class="btn btn-outline-light btn-sm me-3">Ver Inventario</a>
                <span class="me-3" th:text="'Hola, ' + ${usuario.nombre}"></span>
                <a href="/logout" class="btn btn-outline-danger btn-sm">Cerrar Sesión</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <h2 class="mb-4 text-primary">Historial de Mis Reservas</h2>
        
        <div class="card shadow-sm">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th>ID Reserva</th>
                                <th>ID Recurso</th>
                                <th>Estado de Reserva</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Si el usuario no tiene reservas -->
                            <tr th:if="${#lists.isEmpty(reservas)}">
                                <td colspan="3" class="text-center text-muted py-4">No tienes reservas registradas actualmente.</td>
                            </tr>
                            <!-- Listado dinámico -->
                            <tr th:each="res : ${reservas}">
                                <td class="fw-bold" th:text="${res.idReserva}"></td>
                                <td th:text="${res.idRecurso}"></td>
                                <td>
                                    <span class="badge bg-info text-dark" th:text="${res.estado}"></span>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
