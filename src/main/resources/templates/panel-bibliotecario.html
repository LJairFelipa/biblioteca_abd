<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Panel Bibliotecario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-success mb-4">
        <div class="container">
            <a class="navbar-brand" href="/panel">Panel de Administración</a>
            <div class="d-flex align-items-center text-white">
                <!-- Botón para volver al inventario principal -->
                <a href="/" class="btn btn-outline-light btn-sm me-3">Volver al Inventario</a>
                <a href="/gestion-recursos" class="btn btn-outline-warning btn-sm me-3">Gestionar Inventario</a>
                <span class="me-3" th:text="'Bibliotecario: ' + ${usuario.nombre}"></span>
                <a href="/logout" class="btn btn-outline-light btn-sm">Cerrar Sesión</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <h4 class="mb-3 text-primary">1. Reservas Pendientes de Entrega</h4>
        <div class="table-responsive mb-5">
            <table class="table table-bordered bg-white shadow-sm">
                <thead class="table-dark">
                    <tr>
                        <th>ID Reserva</th>
                        <th>ID Usuario</th>
                        <th>ID Recurso</th>
                        <th class="text-center">Acción</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(reservas)}">
                        <td colspan="4" class="text-center text-muted">No hay reservas pendientes.</td>
                    </tr>
                    <tr th:each="res : ${reservas}">
                        <td class="fw-bold" th:text="${res.idReserva}"></td>
                        <td th:text="${res.idUsuario}"></td>
                        <td th:text="${res.idRecurso}"></td>
                        <td class="text-center">
                            <form th:action="@{/entregar-prestamo}" method="post" class="m-0">
                                <input type="hidden" name="idReserva" th:value="${res.idReserva}" />
                                <button type="submit" class="btn btn-primary btn-sm">Aprobar y Entregar</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <h4 class="mb-3 text-success">2. Préstamos Activos (Esperando Devolución)</h4>
        <div class="table-responsive">
            <table class="table table-bordered bg-white shadow-sm">
                <thead class="table-dark">
                    <tr>
                        <th>ID Préstamo</th>
                        <th>ID Recurso</th>
                        <th>Fecha Límite</th>
                        <th class="text-center">Acción</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(prestamos)}">
                        <td colspan="4" class="text-center text-muted">No hay préstamos activos.</td>
                    </tr>
                    <tr th:each="pres : ${prestamos}">
                        <td class="fw-bold" th:text="${pres.idPrestamo}"></td>
                        <td th:text="${pres.idRecurso}"></td>
                        <td th:text="${pres.fechaDevolucionLimite}"></td>
                        <td class="text-center">
                            <form th:action="@{/devolver-prestamo}" method="post" class="m-0">
                                <input type="hidden" name="idPrestamo" th:value="${pres.idPrestamo}" />
                                <button type="submit" class="btn btn-success btn-sm">Registrar Devolución</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
