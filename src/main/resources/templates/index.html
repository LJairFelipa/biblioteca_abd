<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sistema de Biblioteca</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Barra superior dinámica -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">Sistema Biblioteca</a>
            <div class="d-flex align-items-center text-white">
                
                <!-- Botón visible SOLO para el Lector -->
                <a th:if="${usuario.rol == 'LECTOR'}" href="/mis-reservas" class="btn btn-outline-light btn-sm me-2">Mis Reservas</a>
                
                <!-- Botón visible SOLO para el Bibliotecario -->
                <a th:if="${usuario.rol == 'BIBLIOTECARIO'}" href="/panel" class="btn btn-outline-warning btn-sm me-2">Panel Bibliotecario</a>
                
                <span class="me-3" th:text="'Hola, ' + ${usuario.nombre} + ' (' + ${usuario.rol} + ')'"></span>
                <a href="/logout" class="btn btn-outline-danger btn-sm">Cerrar Sesión</a>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <h2 class="text-center mb-4" style="color: #0d6efd;">Inventario de Biblioteca Virtual</h2>
        
        <div class="card shadow-sm">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover table-striped mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th>ID</th>
                                <th>Título</th>
                                <th>Tipo</th>
                                <th>Categoría / Autor</th>
                                <th>Estado</th>
                                <th class="text-center">Acción</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="item : ${recursos}">
                                <td class="fw-bold" th:text="${item.idRecurso}"></td>
                                <td th:text="${item.titulo}"></td>
                                <td><span class="badge bg-secondary" th:text="${item.tipo}"></span></td>
                                <td th:text="${item.autorCategoria}"></td>
                                <td>
                                    <span class="badge" 
                                          th:classappend="${item.estado == 'DISPONIBLE'} ? 'bg-success' : 'bg-warning text-dark'"
                                          th:text="${item.estado}"></span>
                                </td>
                                <td class="text-center">
                                    <!-- Botón de reserva SOLO para el Lector -->
                                    <form th:if="${usuario.rol == 'LECTOR'}" th:action="@{/reservar}" method="post" class="m-0">
                                        <input type="hidden" name="id" th:value="${item.idRecurso}" />
                                        <button type="submit" class="btn btn-outline-primary btn-sm" 
                                                th:disabled="${item.estado != 'DISPONIBLE'}">Reservar</button>
                                    </form>
                                    
                                    <!-- Mensaje en lugar de botón para el Bibliotecario -->
                                    <span th:if="${usuario.rol == 'BIBLIOTECARIO'}" class="text-muted small">Gestión Interna</span>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
