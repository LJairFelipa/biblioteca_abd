<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Inventario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-success mb-4">
        <div class="container">
            <a class="navbar-brand" href="/panel">Panel de Administración</a>
            <div class="d-flex text-white">
                <a href="/panel" class="btn btn-outline-light btn-sm me-3">Volver al Panel</a>
                <a href="/logout" class="btn btn-outline-light btn-sm">Cerrar Sesión</a>
            </div>
        </div>
    </nav>
    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3 class="text-primary">Gestión de Recursos</h3>
            <a href="/nuevo-recurso" class="btn btn-success">+ Agregar Recurso</a>
        </div>
        <table class="table table-bordered bg-white shadow-sm">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Título</th>
                    <th>Tipo</th>
                    <th>Autor / Categoría</th>
                    <th>Estado</th>
                    <th class="text-center">Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="item : ${recursos}">
                    <td th:text="${item.idRecurso}"></td>
                    <td th:text="${item.titulo}"></td>
                    <td th:text="${item.tipo}"></td>
                    <td th:text="${item.autorCategoria}"></td>
                    <td th:text="${item.estado}"></td>
                    <td class="text-center">
                        <a th:href="@{/editar-recurso(id=${item.idRecurso})}" class="btn btn-warning btn-sm">Editar</a>
                        <a th:href="@{/eliminar-recurso(id=${item.idRecurso})}" class="btn btn-danger btn-sm" 
                           onclick="return confirm('¿Seguro que deseas deshabilitar este recurso?');">Eliminar</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
