<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión - Biblioteca</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">
    <div class="card shadow p-4" style="width: 380px;">
        <h3 class="text-center mb-3 text-primary">Biblioteca Virtual</h3>
        <p class="text-center text-muted small">Ingresa con tu correo institucional</p>
        
        <div th:if="${error}" class="alert alert-danger p-2 text-center small" th:text="${error}"></div>
        
        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label class="form-label">Correo electrónico</label>
                <input type="email" name="correo" class="form-control" placeholder="ej. juan@email.com" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Ingresar</button>
        </form>
        
        <div class="mt-3 text-center small text-muted">
            Prueba con: <strong>juan@email.com</strong> (Lector) o <strong>admin@email.com</strong> (Bibliotecario)
        </div>
    </div>
</body>
</html>
