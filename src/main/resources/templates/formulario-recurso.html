<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario de Recurso</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">
    <div class="card shadow-sm p-4" style="width: 500px;">
        <h4 class="text-center mb-4 text-primary">Datos del Recurso</h4>
        
        <form th:action="@{/guardar-recurso}" th:object="${recurso}" method="post">
            <!-- Campo oculto vital para saber si es actualización -->
            <input type="hidden" th:field="*{idRecurso}" />
            <input type="hidden" th:field="*{estado}" />

            <div class="mb-3">
                <label class="form-label">Título / Nombre</label>
                <input type="text" th:field="*{titulo}" class="form-control" required>
            </div>
            
            <div class="mb-3">
                <label class="form-label">Tipo de Recurso</label>
                <select th:field="*{tipo}" class="form-select">
                    <option value="LIBRO">Libro</option>
                    <option value="EQUIPO">Equipo</option>
                    <option value="SALA">Sala de Estudio</option>
                </select>
            </div>

            <div class="mb-4">
                <label class="form-label">Categoría o Autor</label>
                <input type="text" th:field="*{autorCategoria}" class="form-control" required>
            </div>

            <div class="d-flex justify-content-between">
                <a href="/gestion-recursos" class="btn btn-secondary">Cancelar</a>
                <button type="submit" class="btn btn-success">Guardar Recurso</button>
            </div>
        </form>
    </div>
</body>
</html>
